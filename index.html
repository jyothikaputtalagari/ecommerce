<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JoeStudio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <div class="brand">JoeStudio</div>

    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="Search products…" />
    </div>

    <div class="header-actions">
      <button class="icon-btn" id="wishlistBtn">♡
        <span class="count" id="wishlistCount">0</span>
      </button>

      <button class="icon-btn" id="cartBtn">🛒
        <span class="count" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="container hero-inner">
    <div>
      <h1>Refined. Elegant. Intentional.</h1>
      <p>Curated pieces designed for calm, confidence, and timeless style.</p>
      <a href="#products" class="cta">Shop the collection</a>
    </div>
    <img src="joelogo.png" alt="Joe Studio logo">
  </div>
</section>

<section class="controls-bar container">
  <div class="filter-group">
    <select id="categoryFilter">
      <option value="all">All Categories</option>
      <option value="clothing">Clothing</option>
      <option value="accessories">Accessories</option>
      <option value="shoes">Shoes</option>
    </select>

    <select id="sortSelect">
      <option value="featured">Featured</option>
      <option value="price-asc">Price: Low → High</option>
      <option value="price-desc">Price: High → Low</option>
      <option value="rating-desc">Top Rated</option>
    </select>

    <button id="clearFilters">Clear</button>
  </div>
</section>

<main class="container" id="products">
  <section id="productsGrid" class="products-grid"></section>
</main>

<!-- CART -->
<aside id="cartPanel" class="side-panel">
  <div class="panel-header">
    <h3>Your Cart</h3>
    <button class="close-btn" id="closeCart">✖</button>
  </div>
  <div id="cartItems" class="panel-items"></div>
  <div class="panel-footer">
    <span>Subtotal</span>
    <span id="cartSubtotal">₹0</span>
    <button class="primary-btn">Checkout</button>
  </div>
</aside>

<!-- WISHLIST -->
<aside id="wishlistPanel" class="side-panel">
  <div class="panel-header">
    <h3>Your Wishlist</h3>
    <button class="close-btn" id="closeWishlist">✖</button>
  </div>
  <div id="wishlistItems" class="panel-items"></div>
</aside>

<div id="overlay" class="overlay"></div>

<!-- MODAL -->
<div id="productModal" class="product-modal">
  <div class="modal-inner">
    <button class="close-btn" id="closeModal">✖</button>

    <div class="modal-images">
      <img id="modalImage">
    </div>

    <div class="modal-info">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button id="modalWish" class="modal-heart">♥</button>
      </div>

      <div id="modalRating"></div>
      <div id="modalPrice"></div>
      <p id="modalDesc"></p>

      <div class="qty-row">
        <button id="qtyMinus">−</button>
        <span id="qtyDisplay">1</span>
        <button id="qtyPlus">+</button>
      </div>

      <button id="modalAdd" class="primary-btn">Add to Cart</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <p>© 2025 JoeStudio · Crafted with care</p>
  <button id="scrollTop" class="scroll-top">↑</button>
</footer>

<script src="script.js"></script>
</body>
</html>
